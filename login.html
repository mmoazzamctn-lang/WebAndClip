<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAndClip | Admin Access Gateway</title>
    <!-- Icons Link Config -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* RESET BASE FRAMEWORK & DARK MATRIX THEME */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --accent-color: #00FF66; /* Neon Green Theme */
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .login-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #222;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 { font-size: 28px; font-weight: 700; }
        .login-header h2 span { color: var(--accent-color); }
        .login-header p { color: var(--text-muted); font-size: 13px; margin-top: 5px; }
        
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .form-group input[type="text"], .form-group input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            background: #161616;
            border: 1px solid #222;
            color: white;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: var(--accent-color);
        }
        
        /* ALIGNED UTILITY LAYER: Left checkbox & Right Forgot link line */
        .utility-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
            user-select: none;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .checkbox-container input {
            accent-color: var(--accent-color);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        .forgot-link {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        .forgot-link:hover { text-decoration: underline; }
        
        .login-btn {
            background: var(--accent-color);
            color: black;
            border: none;
            padding: 14px;
            font-weight: 700;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .login-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .back-home { display: block; text-align: center; margin-top: 25px; color: var(--text-muted); text-decoration: none; font-size: 14px; }
        .back-home:hover { color: var(--text-main); }

        /* RECOVERY POPUP OVERLAY MODAL */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 10px;
            width: 90%; max-width: 360px; border: 1px solid #333; text-align: center;
        }
        .modal-content h3 { margin-bottom: 15px; font-size: 20px; }
        .modal-content p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
    </style>
</head>
<body>
    <!-- MAIN ENTRY PORTAL FORM CONTAINER -->
    <div class="login-container">
        <div class="login-header">
            <h2>Web&<span>Clip</span></h2>
            <p>Admin Portel Security Gateway</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" placeholder="Username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Security Password</label>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <!-- UTILITY LINE WITH BOX CHECKBOX AND FORGOT LINK -->
            <div class="utility-row">
                <label class="checkbox-container">
                    <input type="checkbox" id="showPassCheckbox" onclick="togglePassCheck()">
                    <span>Show Password</span>
                </label>
                <span class="forgot-link" onclick="openModal()">Forgot Password?</span>
            </div>
            
            <button type="submit" class="login-btn">Access Terminal</button>
            <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Main Portal</a>
        </form>
    </div>

    <!-- SECURE RECOVERY SYSTEM POPUP MODAL -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <i class="fa-solid fa-user-shield" style="font-size:36px; color:var(--accent-color); margin-bottom:12px;"></i>
            <h3>Identity Verification</h3>
            <p>Admin password check karne ke liye apni secure authentication code pin enter karein.</p>
            
            <div style="text-align: left; display: flex; flex-direction: column; gap: 15px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label style="font-size:12px; color:var(--text-muted);">Security Pin Code</label>
                    <input type="password" id="recoveryPinInput" placeholder="Enter pin" style="width:100%; padding:11px; background:#161616; border:1px solid #333; color:white; border-radius:6px; outline:none; font-size:15px;">
                </div>
                <button type="button" class="login-btn" style="padding:11px; font-size:14px;" onclick="revealPassword()">Verify & Reveal</button>
                <button type="button" style="background:transparent; color:var(--text-muted); border:none; text-decoration:underline; font-size:13px; cursor:pointer;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- MAIN CORE PROGRAM DATA ROUTER INTERFACES -->
    <script>
        // Setup initial default core variables according to updated rules
        if (!localStorage.getItem('adminUser') || localStorage.getItem('adminUser') === 'admin') {
            localStorage.setItem('adminUser', 'Moazzam');
            localStorage.setItem('adminPass', 'Moazzam@123');
        }
        // Master private override security pin setup
        localStorage.setItem('masterPinCode', '3111');

        // Checkbox based Toggle visibility function
        function togglePassCheck() {
            const passInput = document.getElementById('password');
            const chkBox = document.getElementById('showPassCheckbox');
            if (chkBox.checked) {
                passInput.type = 'text';
            } else {
                passInput.type = 'password';
            }
        }

        // Window elements modal toggles
        function openModal() { document.getElementById('forgotModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('forgotModal').style.display = 'none'; document.getElementById('recoveryPinInput').value = ''; }

        // Secure password reveal engine mechanism without giving visual hints
        function revealPassword() {
            const pinIn = document.getElementById('recoveryPinInput').value.trim();
            const savedMasterPin = localStorage.getItem('masterPinCode') || '3111';
            const originalPass = localStorage.getItem('adminPass') || 'Moazzam@123';

            if (!pinIn) {
                alert('Please enter your security pin first!');
                return;
            }

            if (pinIn === savedMasterPin) {
                alert('Verification Successful!\n\nYour Admin Password is: ' + originalPass);
                closeModal();
            } else {
                alert('Access Denied! Incorrect security pin verification code parameters.');
                document.getElementById('recoveryPinInput').value = '';
            }
        }

        // Form checker driver loop execution
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value;

            if (userIn === localStorage.getItem('adminUser') && passIn === localStorage.getItem('adminPass')) {
                localStorage.setItem('adminLogged', 'true');
                window.location.href = 'dashboard.html';
            } else {
                alert('Verification Failed! Incorrect admin profile credentials entry.');
            }
        });
    </script>
</body>
</html>
