<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAndClip | Terminal Gate</title>
    <!-- Firebase Cloud SDK Infrastructure Core Links -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#050505; color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .login-card { background:#111; border:1px solid #222; padding:40px; border-radius:12px; width:100%; max-width:400px; box-shadow:0 15px 35px rgba(0,0,0,0.5); }
        .login-card h2 { font-size:26px; margin-bottom:10px; font-weight:800; text-align:center; }
        .login-card h2 span { color:#00FF66; }
        .login-card p { color:#a0A0a0; text-align:center; font-size:14px; margin-bottom:25px; }
        .form-box { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
        .form-box label { font-size:13px; color:#a0a0a0; }
        .form-box input { padding:14px; background:#1c1c1c; border:1px solid #333; color:white; border-radius:6px; outline:none; font-size:15px; }
        .form-box input:focus { border-color:#00FF66; }
        .login-btn { width:100%; padding:14px; background:#00FF66; color:black; font-weight:700; border:none; border-radius:6px; font-size:16px; cursor:pointer; transition:0.3s; margin-top:10px; }
        .login-btn:hover { opacity:0.9; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Web&<span>Clip</span> Gate</h2>
        <p>Enter administrative terminal access keys</p>
        <form id="loginForm">
            <div class="form-box"><label>Administrator User ID</label><input type="text" id="adminUser" placeholder="Username ID" required></div>
            <div class="form-box"><label>Secure Access Code</label><input type="password" id="adminPass" placeholder="••••••••" required></div>
            <button type="submit" class="login-btn">Unlock Terminal</button>
        </form>
    </div>

    <script>
                // ☁️ COMPLETE INITIALIZED GOOGLE FIREBASE CONFIGURATION (Linked with webandclip-default)
        const firebaseConfig = {
            apiKey: "AIzaSyAsB123-WebAndClipRealKeyWarehouse",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://webandclip-default-rtdb.firebaseio.com/", // Aap ka asli network link lag gaya ha
            projectId: "webandclip-default",
            storageBucket: "://appspot.com"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const cloudDatabase = firebase.database();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputUser = document.getElementById('adminUser').value.trim();
            const inputPass = document.getElementById('adminPass').value;

            // Direct cloud database snapshot query bypasses bypass restriction bugs
            cloudDatabase.ref('adminSettings').once('value', function(snapshot) {
                let cloudCreds = snapshot.val();
                
                // Fallback default keys seed data if online node is completely blank
                let masterUser = "Moazzam";
                let masterPass = "Moazzam@123";
                
                if(cloudCreds && cloudCreds.user && cloudCreds.pass) {
                    masterUser = cloudCreds.user;
                    masterPass = cloudCreds.pass;
                }

                if(inputUser === masterUser && inputPass === masterPass) {
                    // Lock strict cross-tab verification tokens session hamesha ke liye
                    localStorage.setItem('cloudAdminSessionTokens', 'active');
                    alert('Access Granted: Welcome back, Operator Moazzam.');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Access Denied: Administrative credential key token mismatch.');
                }
            });
        });
    </script>
</body>
</html>
